<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kreuzstutz — Zugdurchfahrten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-card: #12121a;
      --bg-card-hover: #1a1a28;
      --glass: rgba(255,255,255,0.03);
      --glass-border: rgba(255,255,255,0.06);
      --text-primary: #f0f0f5;
      --text-secondary: rgba(240,240,245,0.55);
      --text-muted: rgba(240,240,245,0.3);
      --accent-red: #e03c31;
      --accent-blue: #2d7dd2;
      --color-ic: #e03c31;
      --color-ec: #8b1a1a;
      --color-ir: #e8590c;
      --color-re: #2f9e44;
      --color-s: #2d7dd2;
      --color-s-alt: #7048e8;
      --arrival: #10b981;
      --departure: #f59e0b;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* === HERO HEADER === */
    .hero {
      position: relative;
      padding: 60px 40px 50px;
      text-align: center;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -20%;
      width: 140%;
      height: 200%;
      background: radial-gradient(ellipse at 50% 0%, rgba(224,60,49,0.08) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(45,125,210,0.06) 0%, transparent 50%);
      pointer-events: none;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(224,60,49,0.1);
      border: 1px solid rgba(224,60,49,0.2);
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-red);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 20px;
    }

    .hero-badge svg { width:14px; height:14px; }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      font-size: 1.05rem;
      color: var(--text-secondary);
      font-weight: 400;
      max-width: 600px;
      margin: 0 auto 8px;
    }

    .hero-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 16px;
    }
    .hero-meta span { color: var(--text-secondary); font-weight: 500; }

    /* === STATS BAR === */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 32px;
      padding: 20px 40px;
      margin: 0 auto 30px;
      max-width: 800px;
      flex-wrap: wrap;
    }

    .stat {
      text-align: center;
    }
    .stat-value {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, rgba(255,255,255,0.8));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 2px;
    }

    /* === FILTER BAR === */
    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 40px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .filter-btn {
      padding: 7px 16px;
      border: 1px solid var(--glass-border);
      border-radius: 100px;
      background: var(--glass);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover {
      background: rgba(255,255,255,0.08);
      color: var(--text-primary);
    }
    .filter-btn.active {
      background: rgba(224,60,49,0.15);
      border-color: rgba(224,60,49,0.3);
      color: var(--accent-red);
    }

    .filter-divider {
      width: 1px;
      height: 24px;
      background: var(--glass-border);
      margin: 0 6px;
    }

    .dir-btn { font-size: 0.85rem; }
    .dir-btn.active.dir-an {
      background: rgba(16,185,129,0.12);
      border-color: rgba(16,185,129,0.3);
      color: var(--arrival);
    }
    .dir-btn.active.dir-ab {
      background: rgba(245,158,11,0.12);
      border-color: rgba(245,158,11,0.3);
      color: var(--departure);
    }

    /* === TIMELINE === */
    .timeline-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    .hour-group {
      margin-bottom: 8px;
    }

    .hour-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0 8px;
      position: sticky;
      top: 0;
      background: linear-gradient(180deg, var(--bg) 60%, transparent 100%);
      z-index: 10;
    }

    .hour-time {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-muted);
      min-width: 60px;
      font-variant-numeric: tabular-nums;
    }
    .hour-line {
      flex: 1;
      height: 1px;
      background: var(--glass-border);
    }
    .hour-count {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .train-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 10px;
      padding-left: 76px;
    }

    /* === TRAIN CARD === */
    .train-card {
      display: flex;
      align-items: stretch;
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .train-card:hover {
      background: var(--bg-card-hover);
      border-color: rgba(255,255,255,0.12);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .card-accent {
      width: 4px;
      flex-shrink: 0;
    }
    .card-accent.cat-ic, .card-accent.cat-ic21 { background: var(--color-ic); }
    .card-accent.cat-ec { background: var(--color-ec); }
    .card-accent.cat-ir, .card-accent.cat-ir15, .card-accent.cat-ir26, .card-accent.cat-ir27, .card-accent.cat-ir70, .card-accent.cat-ir75 { background: var(--color-ir); }
    .card-accent.cat-re7, .card-accent.cat-re24 { background: var(--color-re); }
    .card-accent.cat-s1, .card-accent.cat-s6, .card-accent.cat-s9 { background: var(--color-s); }
    .card-accent.cat-s77, .card-accent.cat-s99 { background: var(--color-s-alt); }

    .card-body {
      flex: 1;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .card-time-block {
      text-align: center;
      flex-shrink: 0;
      min-width: 50px;
    }
    .card-time {
      font-size: 1.3rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .card-time.time-an { color: var(--arrival); }
    .card-time.time-ab { color: var(--departure); }
    .card-dir-label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
      margin-top: 3px;
    }
    .card-dir-label.dir-an { color: rgba(16,185,129,0.6); }
    .card-dir-label.dir-ab { color: rgba(245,158,11,0.6); }

    .card-info {
      flex: 1;
      min-width: 0;
    }

    .card-line-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .line-badge {
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
    }
    .line-badge.cat-ic, .line-badge.cat-ic21 { background: var(--color-ic); }
    .line-badge.cat-ec { background: var(--color-ec); }
    .line-badge.cat-ir, .line-badge.cat-ir15, .line-badge.cat-ir26, .line-badge.cat-ir27, .line-badge.cat-ir70, .line-badge.cat-ir75 { background: var(--color-ir); }
    .line-badge.cat-re7, .line-badge.cat-re24 { background: var(--color-re); }
    .line-badge.cat-s1, .line-badge.cat-s6, .line-badge.cat-s9 { background: var(--color-s); }
    .line-badge.cat-s77, .line-badge.cat-s99 { background: var(--color-s-alt); }

    .card-route {
      font-size: 0.82rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-route-arrow {
      color: var(--text-muted);
      margin: 0 4px;
    }

    .card-luzern-time {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .card-img {
      width: 100px;
      height: 70px;
      object-fit: cover;
      flex-shrink: 0;
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    .train-card:hover .card-img { opacity: 1; }

    /* === MODAL === */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
    }

    .modal-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .modal-body { padding: 28px; }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .modal-badge {
      padding: 6px 16px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
    }
    .modal-time {
      font-size: 1.6rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .modal-dir-badge {
      margin-left: auto;
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .modal-dir-badge.dir-an { background: rgba(16,185,129,0.12); color: var(--arrival); }
    .modal-dir-badge.dir-ab { background: rgba(245,158,11,0.12); color: var(--departure); }

    .modal-detail {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px 16px;
      font-size: 0.9rem;
    }
    .modal-label { color: var(--text-muted); font-weight: 500; }
    .modal-value { color: var(--text-primary); }

    .modal-route-vis {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 24px;
      padding: 16px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
    }
    .route-station {
      font-size: 0.85rem;
      font-weight: 600;
    }
    .route-line {
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, var(--text-muted) 0%, var(--text-muted) 100%);
      position: relative;
    }
    .route-dot {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-red);
      box-shadow: 0 0 8px rgba(224,60,49,0.5);
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 2;
    }
    .modal-close:hover { background: rgba(0,0,0,0.8); }

    .modal-img-credit {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-align: center;
      padding: 8px 28px 16px;
    }
    .modal-img-credit a { color: var(--text-muted); text-decoration: underline; }

    /* === RESPONSIVE === */
    @media (max-width: 768px) {
      .hero { padding: 40px 20px 30px; }
      .stats-bar { gap: 20px; }
      .train-grid { padding-left: 0; grid-template-columns: 1fr; }
      .filter-bar { padding: 12px 16px; }
      .timeline-container { padding: 0 12px 40px; }
      .card-img { width: 80px; height: 60px; }
    }

    /* === SCROLL ANIMATION === */
    .train-card {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.35s ease forwards;
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- HERO -->
  <header class="hero">
    <div class="hero-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Trackside Schedule
    </div>
    <h1>Luzern Kreuzstutz</h1>
    <p class="hero-subtitle">Alle Züge, die täglich an der Baselstrasse beim Kreuzstutz vorbeifahren — mit interpolierten Durchfahrtszeiten.</p>
    <p class="hero-meta">Standort: <span>47.054°N, 8.297°E</span> · Strecke: <span>Luzern ↔ Emmenbrücke</span></p>
  </header>

  <!-- STATS -->
  <div class="stats-bar" id="stats-bar"></div>

  <!-- FILTERS -->
  <div class="filter-bar" id="filter-bar"></div>

  <!-- TIMELINE -->
  <div class="timeline-container" id="timeline"></div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" style="position:relative;">
      <button class="modal-close" id="modal-close">×</button>
      <img class="modal-img" id="modal-img" src="" alt="">
      <div class="modal-img-credit" id="modal-img-credit"></div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

<script>
// === TRAIN IMAGES (Wikimedia Commons — freely licensed) ===
const TRAIN_IMAGES = {

  'IC21': { url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/FFS_RABDe_500_Olten.jpg/640px-FFS_RABDe_500_Olten.jpg', credit: 'SBB RABDe 500 ICN — Wikimedia Commons', creditUrl: 'https://commons.wikimedia.org/wiki/File:FFS_RABDe_500_Olten.jpg' },

  'IR70': { url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/ed/SBB_Giruno_bei_Muri_AG.jpg/640px-SBB_Giruno_bei_Muri_AG.jpg', credit: 'SBB Giruno IR70 — Wikimedia Commons', creditUrl: 'https://commons.wikimedia.org/wiki/File:SBB_Giruno_bei_Muri_AG.jpg' },
  'IR75': { url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/SBB_RABe_502_Twinsdexx_bei_Fribourg.jpg/640px-SBB_RABe_502_Twinsdexx_bei_Fribourg.jpg', credit: 'SBB RABe 502 Twindexx IR75 — Wikimedia Commons', creditUrl: 'https://commons.wikimedia.org/wiki/File:SBB_RABe_502_Twinsdexx_bei_Fribourg.jpg' },

const FALLBACK_IMG = 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/8f/SBB_RABe_520_GTW_Luzern_S-Bahn.jpg/640px-SBB_RABe_520_GTW_Luzern_S-Bahn.jpg';

function getTrainImage(line) {
  return TRAIN_IMAGES[line] || { url: FALLBACK_IMG, credit: 'Wikimedia Commons', creditUrl: '#' };
}

function getCatClass(line) {
  return 'cat-' + line.toLowerCase().replace(/\s+/g, '');
}

// === CSV DATA (embedded) ===
const CSV_DATA = `richtung,zeit_punkt,zeit,linie,von,nach

// === PARSE CSV ===
function parseCSV(csv) {
  const lines = csv.trim().split('\n');
  const headers = lines[0].split(',');
  return lines.slice(1).map(line => {
    const vals = line.split(',');
    const obj = {};
    headers.forEach((h, i) => obj[h.trim()] = (vals[i] || '').trim());
    return obj;
  });
}

// === RENDER ===
let allTrains = [];
let activeLines = new Set();
let activeDir = null; // null = both

function init() {
  allTrains = parseCSV(CSV_DATA);

  // Collect unique lines
  const lines = [...new Set(allTrains.map(t => t.linie))].sort((a,b) => {
    const order = { IC:0, IC21:1, EC:2, IR:3, IR15:4, IR26:5, IR27:6, IR70:7, IR75:8, RE7:9, RE24:10, S1:11, S6:12, S9:13, S77:14, S99:15 };
    return (order[a] ?? 99) - (order[b] ?? 99);
  });

  renderStats();
  renderFilters(lines);
  renderTimeline();
}

function renderStats() {
  const arrivals = allTrains.filter(t => t.richtung === 'an').length;
  const departures = allTrains.filter(t => t.richtung === 'ab').length;
  const lines = new Set(allTrains.map(t => t.linie)).size;

  // First & last train
  const times = allTrains.map(t => t.zeit_punkt).sort();
  const first = times[0]?.substring(0,5) || '--:--';

  // Find the last "real" train (excluding 00:xx which are after midnight)
  const realTimes = allTrains.map(t => t.zeit_punkt).filter(t => !t.startsWith('00:')).sort();
  const last = realTimes[realTimes.length - 1]?.substring(0,5) || times[times.length-1]?.substring(0,5) || '--:--';

  document.getElementById('stats-bar').innerHTML = `
    <div class="stat"><div class="stat-value">${allTrains.length}</div><div class="stat-label">Züge pro Tag</div></div>
    <div class="stat"><div class="stat-value" style="color:var(--arrival)">${arrivals}</div><div class="stat-label">Ankünfte</div></div>
    <div class="stat"><div class="stat-value" style="color:var(--departure)">${departures}</div><div class="stat-label">Abfahrten</div></div>
    <div class="stat"><div class="stat-value">${lines}</div><div class="stat-label">Linien</div></div>
    <div class="stat"><div class="stat-value">${first}</div><div class="stat-label">Erster Zug</div></div>
    <div class="stat"><div class="stat-value">${last}</div><div class="stat-label">Letzter Zug</div></div>
  `;
}

function renderFilters(lines) {
  let html = '';

  // Direction filters
  html += `<button class="filter-btn dir-btn dir-an active" data-dir="an">↓ Ankünfte</button>`;
  html += `<button class="filter-btn dir-btn dir-ab active" data-dir="ab">↑ Abfahrten</button>`;
  html += `<div class="filter-divider"></div>`;

  // Line filters
  lines.forEach(line => {
    html += `<button class="filter-btn line-btn" data-line="${line}">${line}</button>`;
  });

  document.getElementById('filter-bar').innerHTML = html;

  // Direction click handlers
  document.querySelectorAll('.dir-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.classList.toggle('active');
      updateFilter();
    });
  });

  // Line click handlers
  document.querySelectorAll('.line-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.classList.toggle('active');
      if (btn.classList.contains('active')) {
        activeLines.add(btn.dataset.line);
      } else {
        activeLines.delete(btn.dataset.line);
      }
      renderTimeline();
    });
  });
}

function updateFilter() {
  renderTimeline();
}

function getFilteredTrains() {
  let filtered = allTrains;

  // Direction filter
  const anActive = document.querySelector('.dir-btn.dir-an')?.classList.contains('active');
  const abActive = document.querySelector('.dir-btn.dir-ab')?.classList.contains('active');

  if (anActive && !abActive) filtered = filtered.filter(t => t.richtung === 'an');
  else if (!anActive && abActive) filtered = filtered.filter(t => t.richtung === 'ab');
  else if (!anActive && !abActive) filtered = [];

  // Line filter
  if (activeLines.size > 0) {
    filtered = filtered.filter(t => activeLines.has(t.linie));
  }

  return filtered;
}

function renderTimeline() {
  const trains = getFilteredTrains();

  // Group by hour
  const hourGroups = {};
  trains.forEach(t => {
    const hour = t.zeit_punkt.substring(0, 2);
    if (!hourGroups[hour]) hourGroups[hour] = [];
    hourGroups[hour].push(t);
  });

  const sortedHours = Object.keys(hourGroups).sort();

  let html = '';
  sortedHours.forEach(hour => {
    const group = hourGroups[hour];

    html += `<div class="hour-group">`;
    html += `<div class="hour-header">`;
    html += `<span class="hour-time">${hour}:00</span>`;
    html += `<span class="hour-line"></span>`;
    html += `<span class="hour-count">${group.length} Züge</span>`;
    html += `</div>`;
    html += `<div class="train-grid">`;

    group.forEach((t, i) => {
      const catClass = getCatClass(t.linie);
      const timeShort = t.zeit_punkt.substring(0, 5);
      const luzernTime = t.zeit.substring(0, 5);
      const dirClass = t.richtung === 'an' ? 'time-an' : 'time-ab';
      const dirLabel = t.richtung === 'an' ? 'ankunft' : 'abfahrt';
      const dirLabelClass = t.richtung === 'an' ? 'dir-an' : 'dir-ab';
      const img = getTrainImage(t.linie);
      const delay = Math.min(i * 40, 300);

      const luzernLabel = t.richtung === 'an'
        ? `Luzern an ${luzernTime}`
        : `Luzern ab ${luzernTime}`;

      html += `
        <div class="train-card" style="animation-delay: ${delay}ms" onclick="openModal(${JSON.stringify(t).replace(/"/g,'&quot;')})">
          <div class="card-accent ${catClass}"></div>
          <div class="card-body">
            <div class="card-time-block">
              <div class="card-time ${dirClass}">${timeShort}</div>
              <div class="card-dir-label ${dirLabelClass}">${dirLabel}</div>
            </div>
            <div class="card-info">
              <div class="card-line-row">
                <span class="line-badge ${catClass}">${t.linie}</span>
              </div>
              <div class="card-route">${t.von} <span class="card-route-arrow">→</span> ${t.nach}</div>
              <div class="card-luzern-time">${luzernLabel}</div>
            </div>
          </div>
          <img class="card-img" src="${img.url}" alt="${t.linie}" loading="lazy" onerror="this.style.display='none'">
        </div>
      `;
    });

    html += `</div></div>`;
  });

  if (trains.length === 0) {
    html = `<div style="text-align:center; padding:60px; color:var(--text-muted);">
      <p style="font-size:1.2rem; margin-bottom:8px;">Keine Züge gefunden</p>
      <p>Passe die Filter oben an.</p>
    </div>`;
  }

  document.getElementById('timeline').innerHTML = html;
}

// === MODAL ===
function openModal(train) {
  const img = getTrainImage(train.linie);
  const catClass = getCatClass(train.linie);
  const timeShort = train.zeit_punkt.substring(0, 5);
  const luzernTime = train.zeit.substring(0, 5);
  const dirClass = train.richtung === 'an' ? 'dir-an' : 'dir-ab';
  const dirLabel = train.richtung === 'an' ? 'Ankunft' : 'Abfahrt';
  const timeClass = train.richtung === 'an' ? 'time-an' : 'time-ab';

  document.getElementById('modal-img').src = img.url;
  document.getElementById('modal-img-credit').innerHTML = `Bild: <a href="${img.creditUrl}" target="_blank">${img.credit}</a>`;

  const luzernLabel = train.richtung === 'an'
    ? `Ankunft Luzern: ${luzernTime}`
    : `Abfahrt Luzern: ${luzernTime}`;

  // Calculate time difference
  const punktParts = train.zeit_punkt.split(':').map(Number);
  const zeitParts = train.zeit.split(':').map(Number);
  const punktMin = punktParts[0] * 60 + punktParts[1];
  let zeitMin = zeitParts[0] * 60 + zeitParts[1];
  if (zeitMin >= 1440) zeitMin -= 1440; // Handle 24:xx times
  const diff = Math.abs(punktMin - zeitMin);

  document.getElementById('modal-body').innerHTML = `
    <div class="modal-header">
      <span class="line-badge modal-badge ${catClass}">${train.linie}</span>
      <span class="modal-time ${timeClass}">${timeShort}</span>
      <span class="modal-dir-badge ${dirClass}">${dirLabel}</span>
    </div>
    <div class="modal-detail">
      <span class="modal-label">Durchfahrt Kreuzstutz</span>
      <span class="modal-value" style="font-weight:700;">${timeShort}</span>
      <span class="modal-label">${luzernLabel.split(':')[0]}</span>
      <span class="modal-value">${luzernTime}</span>
      <span class="modal-label">Differenz</span>
      <span class="modal-value">${diff} min</span>
      <span class="modal-label">Von</span>
      <span class="modal-value">${train.von}</span>
      <span class="modal-label">Nach</span>
      <span class="modal-value">${train.nach}</span>
      <span class="modal-label">Richtung</span>
      <span class="modal-value">${train.richtung === 'an' ? '↓ Richtung Luzern' : '↑ Von Luzern weg'}</span>
    </div>
    <div class="modal-route-vis">
      <span class="route-station">${train.von}</span>
      <div class="route-line">
        <div class="route-dot" style="left: ${train.richtung === 'an' ? '70%' : '30%'};" title="Kreuzstutz"></div>
      </div>
      <span class="route-station">${train.nach}</span>
    </div>
  `;

  document.getElementById('modal-overlay').classList.add('active');
}

document.getElementById('modal-close').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.remove('active');
});
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) {
    document.getElementById('modal-overlay').classList.remove('active');
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') document.getElementById('modal-overlay').classList.remove('active');
});

// GO
init();
</script>
